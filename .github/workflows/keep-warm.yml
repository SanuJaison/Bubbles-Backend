name: Keep backend warm

# Render's free plan stops the service after 15 minutes without traffic, so
# the first request after a quiet spell can take ~40 seconds. A light ping
# every 10 minutes keeps it awake without paying for an instance.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        run: |
          curl -fsS --max-time 60 https://bubbles-backend-bx2c.onrender.com/ > /dev/null
          echo "Backend is awake."
